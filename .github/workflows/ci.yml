name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: pip install playwright==1.63.0
      - run: python -m playwright install --with-deps chromium webkit
      - run: PYTHONDONTWRITEBYTECODE=1 python -m unittest e2e/test_ui.py -q
